<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Geometric Glowing Cube / ERP Prism -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="0,-100 86,-50 0,0 -86,-50" fill="#60a5fa" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="-86,-50 0,0 0,100 -86,50" fill="url(#accentGrad)" />
    <!-- Right Face -->
    <polygon points="0,0 86,-50 86,50 0,100" fill="#4338ca" opacity="0.95" />
  </g>

  <!-- "P" Monogram -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">PRIME</text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="12">ERP</text>
</svg>
