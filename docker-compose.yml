version: '3.8'

services:
  # Database Service: Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prime_erp_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PrimeErp@2026Password!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PrimeErp@2026Password!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Backend Service: ASP.NET Core 8 Web API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prime_erp_backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ErpDb=Server=sqlserver,1433;Database=ERP;User Id=sa;Password=PrimeErp@2026Password!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Jwt__SecretKey=PRIME_ERP_PRODUCTION_JWT_SECRET_KEY_FOR_AUTHENTICATION_2026_ENTERPRISE_SECURE_TOKEN!
      - Jwt__Issuer=PrimeErpApi
      - Jwt__Audience=PrimeErpClient
      - Jwt__ExpireDays=7
      - Cors__AllowedOrigins__0=http://localhost
      - Cors__AllowedOrigins__1=http://localhost:80
      - Cors__AllowedOrigins__2=http://localhost:3000
      - Cors__AllowedOrigins__3=http://localhost:5173
    ports:
      - "5000:8080"
    restart: unless-stopped

  # Frontend Service: React 18 + Vite SPA on Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prime_erp_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
